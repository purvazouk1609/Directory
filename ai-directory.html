<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Directory</title>
<style>
  /* ===== Brand colours — change these 5 values to match your logo exactly ===== */
  :root {
    --bg:        #0b1a22;   /* page background (deep navy) */
    --card:      #11262f;   /* button / card surface       */
    --accent:    #2dd4bf;   /* primary accent (turquoise)  */
    --accent-2:  #0891b2;   /* secondary accent (deep teal)*/
    --text:      #eafaf7;   /* main text                   */
    --muted:     #8fb3b5;   /* secondary text              */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(8,145,178,.28), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(45,212,191,.20), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 20px 40px;
  }
  header { text-align: center; margin-bottom: 44px; }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); margin-top: 10px; font-size: 1.05rem; }
  nav {
    width: 100%; max-width: 920px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px;
  }
  @media (max-width: 460px) { nav { grid-template-columns: 1fr; } }
  .btn {
    display: flex; align-items: center; gap: 16px;
    padding: 22px 24px; text-decoration: none; color: var(--text);
    background: var(--card);
    border: 1px solid rgba(45,212,191,.28);
    border-radius: 16px;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .btn:hover, .btn:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 30px rgba(45,212,191,.28);
    outline: none;
  }
  .num {
    flex: 0 0 48px; height: 48px; border-radius: 12px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 1.2rem; color: #04202a;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .label { flex: 1; }
  .label strong { display: block; font-size: 1.1rem; }
  .label span { color: var(--muted); font-size: .88rem; }
  .arrow { color: var(--accent); font-size: 1.4rem; transition: transform .18s; }
  .btn:hover .arrow { transform: translateX(5px); }
  footer { margin-top: auto; padding-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
  <header>
    <h1>AI Directory</h1>
    <p>Your dashboards, one click away</p>
  </header>

  <nav>
    <a class="btn" href="https://claude.ai/artifact/GBPwb3QfkQHLoNVG8BJagj" target="_blank" rel="noopener">
      <div class="num">1</div>
      <div class="label"><strong>Zouk NPS Pulse</strong><span>Customer NPS tracking</span></div>
      <div class="arrow">→</div>
    </a>
    <a class="btn" href="https://claude.ai/artifact/HM2AuMSVajQpj5HWAr9T5P" target="_blank" rel="noopener">
      <div class="num">2</div>
      <div class="label"><strong>Logistics &amp; Delivery Control Tower</strong><span>Zouk D2C logistics</span></div>
      <div class="arrow">→</div>
    </a>
    <a class="btn" href="https://claude.ai/artifact/3mMUgBJbQiPbt2XWhwHX7e" target="_blank" rel="noopener">
      <div class="num">3</div>
      <div class="label"><strong>Brand &amp; Marketing Intelligence</strong><span>Brand and marketing insights</span></div>
      <div class="arrow">→</div>
    </a>
    <a class="btn" href="https://claude.ai/artifact/PtZVNjq4mHUs5bfeCngzCz" target="_blank" rel="noopener">
      <div class="num">4</div>
      <div class="label"><strong>ZoukListens</strong><span>Instagram sentiment dashboard</span></div>
      <div class="arrow">→</div>
    </a>
  </nav>

  <footer>AI Directory</footer>
</body>
</html>
